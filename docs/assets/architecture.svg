<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740" role="img" aria-labelledby="title desc">
<title id="title">PiMesh — research across people and endpoints</title>
<desc id="desc">Researchers use independent local meshpi clients powered by Pi, preserving Sessions and Transcripts. The protected browser directory connects to an HTTPS API and PostgreSQL. Dashed team connections are planned; local transcripts are not automatically uploaded.</desc>
<defs>
  <radialGradient id="bg" cx="48%" cy="40%" r="75%"><stop stop-color="#163b32"/><stop offset="1" stop-color="#091614"/></radialGradient>
  <linearGradient id="panel" x2="0.8" y2="1"><stop stop-color="#17352e"/><stop offset="1" stop-color="#10241f"/></linearGradient>
  <linearGradient id="mint"><stop stop-color="#c5f6d5"/><stop offset="1" stop-color="#75d8ba"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b4e9ce" stroke-opacity=".035"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#8ac7ae" stroke-width="1.5"/></marker>
</defs>
<rect width="1440" height="740" rx="24" fill="url(#bg)"/>
<rect width="1440" height="740" rx="24" fill="url(#grid)"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
