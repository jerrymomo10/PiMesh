  <text x="56" y="110" fill="#edf8f1" font-size="38" font-weight="600" letter-spacing="-1">Many researchers. One shared direction.</text>
  <text x="56" y="144" fill="#99b8aa" font-size="16">Independent local agents, with a path toward connected research.</text>
  <circle cx="1190" cy="51" r="4" fill="#a4e6be"/><text x="1203" y="56" fill="#b0c9bc" font-size="12">EARLY DEVELOPMENT</text>
  <path d="M56 178H1384" stroke="#325046"/>
